
<!doctype html>
<html>
  <head>
    <title>Kohvitassid funktsiooniga</title>

    <script>
      let g;

      // Funktsioon kohvitassi joonistamiseks
      // x, y - kohvitassi asukoht
      // suurus - kohvitassi suurus
      // varv - kohvitassi värv

      function kohvitass(x, y, suurus, varv){

        // Tassi keha
        g.fillStyle = varv;
        g.fillRect(x, y, 150 * suurus, 120 * suurus);

        // Tassi sang
        g.beginPath();
        g.arc(x + 150 * suurus, y + 60 * suurus,
              35 * suurus, -Math.PI / 2, Math.PI / 2);
        g.stroke();

        // Kohvi pind
        g.fillStyle = "saddlebrown";
        g.beginPath();
        g.arc(x + 75 * suurus, y, 75 * suurus, 0, Math.PI);
        g.fill();

        // Tassi alumine joon
        g.beginPath();
        g.moveTo(x, y + 120 * suurus);
        g.lineTo(x + 150 * suurus, y + 120 * suurus);
        g.stroke();
      }

      function joonista(){

        g = tahvel.getContext("2d");

	        // Kolm erinevat kohvitassi
        kohvitass(30, 100, 0.6, "pink");
        kohvitass(130, 80, 0.8, "lightblue");
        kohvitass(260, 120, 0.5, "orange");

      }
    </script>
  </head>

  <body onload="joonista()">
    <h1>Minu kohvitassid</h1>

    <canvas id="tahvel" width="500" height="300">
    </canvas>
  </body>
</html>
