
<!doctype html>
<html>
  <head>
    <title>Kohvitassid auruga</title>

    <script>
      let g;

      // Funktsioon kohvitassi joonistamiseks
      // x, y - kohvitassi asukoht
      // suurus - kohvitassi suurus
      // varv - kohvitassi värv
      // aurudeArv - aurujuttude arv

      function kohvitass(x, y, suurus, varv, aurudeArv){

        // Tassi keha
        g.fillStyle = varv;
        g.fillRect(x, y, 150 * suurus, 120 * suurus);

        // Tassi sang
        g.beginPath();
        g.arc(x + 150 * suurus, y + 60 * suurus,
              35 * suurus, -Math.PI / 2, Math.PI / 2);
        g.stroke();

        // Kohvi pind
        g.fillStyle = "saddlebrown";
        g.beginPath();
        g.arc(x + 75 * suurus, y, 75 * suurus, 0, Math.PI);
        g.fill();

        // Tassi alumine joon
        g.beginPath();
        g.moveTo(x, y + 120 * suurus);
        g.lineTo(x + 150 * suurus, y + 120 * suurus);
        g.stroke();

        // Aurujuttide joonistamine
        for(let i = 0; i < aurudeArv; i++){

          let ax = x + (40 + i * 30) * suurus;

          g.beginPath();
          g.moveTo(ax, y - 10 * suurus);
          g.lineTo(ax - 10 * suurus, y - 30 * suurus);
          g.lineTo(ax, y - 50 * suurus);
          g.stroke();

        }
      }

      function joonista(){

        g = tahvel.getContext("2d");

        // Joonistame erinevad kohvitassid
        kohvitass(30, 150, 0.6, "pink", 2);
        kohvitass(200, 120, 0.8, "lightblue", 3);
        kohvitass(400, 170, 0.5, "orange", 4);

      }
    </script>
  </head>

  <body onload="joonista()">
    <h1>Kohvitassid auruga</h1>

    <canvas id="tahvel" width="650" height="350">
    </canvas>
  </body>
</html>
