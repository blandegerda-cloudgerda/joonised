
<!doctype html>
<html>
  <head>
    <title>Kohvitass</title>

    <script>
      function joonista(){
        let g = tahvel.getContext("2d");

        // Tassi keha
        g.fillStyle = "brown";
        g.fillRect(120, 130, 150, 120);

        // Tassi sang
        g.beginPath();
        g.arc(270, 190, 35, -Math.PI / 2, Math.PI / 2);
        g.stroke();

        // Kohvi pind
        g.fillStyle = "saddlebrown";
        g.beginPath();
        g.arc(195, 130, 75, 0, Math.PI);
        g.fill();

        // Tassi alumine joon
        g.beginPath();
        g.moveTo(120, 250);
        g.lineTo(270, 250);
        g.stroke();
      }
    </script>
  </head>

  <body onload="joonista()">
    <h1>Kohvitass</h1>

    <canvas id="tahvel" width="400" height="300">
    </canvas>
  </body>
</html>
