<!DOCTYPE html>
<html>
<head>
    <title>Kohvitasside lisamine</title>
</head>
<body onload="joonista()">

<h2>Kohvitassid</h2>

<label>Vali kohvitassi värv:</label>
<select id="varv">
    <option value="pink">Roosa</option>
    <option value="purple">Lilla</option>
    <option value="orange">Oranž</option>
    <option value="lightblue">Helesinine</option>
    <option value="green">Roheline</option>
</select>

<br><br>

<label>Vali kohvitassi suurus:</label>
<select id="suurus">
    <option value="0.5">Väike</option>
    <option value="0.8">Keskmine</option>
    <option value="1">Suur</option>
</select>

<br><br>

<button onclick="lisaTass()">Lisa kohvitass</button>

<br><br>

<canvas id="tahvel" width="650" height="400" style="border:1px solid black;"></canvas>

<script>
let g;

let kohviandmed = [
    { x: 30, y: 150, suurus: 0.6, varv: "pink", aurudeArv: 2 },
    { x: 220, y: 120, suurus: 0.8, varv: "lightblue", aurudeArv: 3 }
];

function joonista() {
    let tahvel = document.getElementById("tahvel");
    g = tahvel.getContext("2d");

    g.clearRect(0, 0, 650, 400);

    for (let i = 0; i < kohviandmed.length; i++) {
        let d = kohviandmed[i];
        kohvitass(d.x, d.y, d.suurus, d.varv, d.aurudeArv);
    }
}

function lisaTass() {
    let varv = document.getElementById("varv").value;
    let suurus = Number(document.getElementById("suurus").value);

    let uusTass = {
        x: 30 + kohviandmed.length * 150,
        y: 200,
        suurus: suurus,
        varv: varv,
        aurudeArv: 3
    };

    kohviandmed.push(uusTass);
    joonista();
}

function kohvitass(x, y, suurus, varv, aurudeArv) {
    g.fillStyle = varv;
    g.fillRect(x, y, 100 * suurus, 120 * suurus);

    g.beginPath();
    g.arc(x + 100 * suurus, y + 60 * suurus, 25 * suurus, -Math.PI / 2, Math.PI / 2);
    g.strokeStyle = varv;
    g.lineWidth = 8 * suurus;
    g.stroke();

    g.beginPath();
    g.arc(x + 50 * suurus, y, 50 * suurus, 0, Math.PI);
    g.fillStyle = "#5c3825";
    g.fill();

    g.strokeStyle = "gray";
    g.lineWidth = 2;

    for (let i = 0; i < aurudeArv; i++) {
        let ax = x + (25 + i * 20) * suurus;

        g.beginPath();
        g.moveTo(ax, y - 10 * suurus);
        g.lineTo(ax + 5 * suurus, y - 25 * suurus);
        g.lineTo(ax, y - 40 * suurus);
        g.stroke();
    }
}
</script>

</body>
</html>
